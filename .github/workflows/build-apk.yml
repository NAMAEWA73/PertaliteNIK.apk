name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Instal Android SDK
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instal Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          mkdir project
          unzip -q "$ZIP" -d project
          echo "Isi project:"
          find project -maxdepth 2 -type f | head -50

      - name: Build APK
        run: |
          cd project
          sed -i '/id("com.google.gms.google-services")/d' app/build.gradle.kts
          gradle assembleDebug

      - name: Ambil APK
        uses: actions/upload-artifact@v4
        with:
          name: PertaliteNIK-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
